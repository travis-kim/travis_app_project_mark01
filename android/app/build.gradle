plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.photo_cleaner_mvp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.photo_cleaner_mvp'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
